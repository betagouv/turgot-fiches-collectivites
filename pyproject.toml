[project]
name = "sully"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "typst>=0.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sully = "sully.cli:main"
sully-import = "sully.cli_import:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
